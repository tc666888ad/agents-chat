services:
  agents-chat:
    build: .
    image: agents-chat:v1
    container_name: agents-chat
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-3010}:3000"
    environment:
      PORT: "3000"
      NEGOTIATION_DB: /app/data/negotiation.db
      LOG_LEVEL: info
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
